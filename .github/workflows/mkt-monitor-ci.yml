name: mkt-monitor 镜像构建制品上传 CI


on:

  workflow_dispatch:


permissions:

  contents: read



env:


  # ===============================
  # MinIO Operator Tenant
  # HTTPS
  # ===============================

  MINIO_ENDPOINT: https://minio.minio-tenant.svc.cluster.local:443


  MINIO_BUCKET: dockerfile


  MINIO_ACCESS_KEY: harbor


  MINIO_SECRET_KEY: Ru724DDEi3Xs6JjSBluT1UZEEo7CrfulmPk8Lmo7





jobs:


  build:


    name: 构建 Docker 镜像并上传 MinIO


    runs-on: arc-mkt-monitor



    steps:



      # =====================================
      # Checkout
      # =====================================

      - name: 拉取代码

        uses: actions/checkout@v4





      # =====================================
      # 环境检查
      # =====================================

      - name: Runner 环境检查

        run: |

          echo "========== Runner =========="

          uname -a


          echo

          echo "========== Docker =========="

          docker version





      # =====================================
      # 设置版本
      #
      # 示例:
      # 20260929-a83f21
      #
      # =====================================

      - name: 设置镜像版本

        run: |

          DATE=$(date +%Y%m%d)

          SHA=$(git rev-parse --short HEAD)


          IMAGE_TAG=${DATE}-${SHA}


          echo "IMAGE_NAME=mkt-monitor" >> $GITHUB_ENV

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV


          echo "=============================="

          echo "IMAGE TAG=${IMAGE_TAG}"

          echo "=============================="







      # =====================================
      # 安装 MinIO Client
      # ARM64 Runner
      # =====================================

      - name: 安装 MinIO Client

        run: |

          MC_VERSION="RELEASE.2025-08-13T08-35-41Z"


          MC_URL="https://github.com/minio/mc/releases/download/${MC_VERSION}/mc.linux-arm64.${MC_VERSION}"


          echo "Download MinIO Client"

          echo ${MC_URL}


          curl -fL "${MC_URL}" -o mc


          echo "Check mc"


          ls -lh mc


          chmod +x mc


          sudo mv mc /usr/local/bin/mc


          mc --version





      # =====================================
      # MinIO连接测试
      #
      # 流程:
      # 1. 登录
      # 2. 创建txt
      # 3. 上传
      # 4. 查看
      # 5. 删除
      #
      # =====================================

      - name: MinIO 连接测试

        run: |


          echo "========== MinIO Login =========="


          mc alias set minio \
            ${MINIO_ENDPOINT} \
            ${MINIO_ACCESS_KEY} \
            ${MINIO_SECRET_KEY} \
            --insecure




          echo "========== Create Test File =========="


          echo "MinIO connection test $(date)" > minio-test.txt


          cat minio-test.txt





          echo "========== Upload Test File =========="


          mc cp \
            minio-test.txt \
            minio/${MINIO_BUCKET}/test/minio-test.txt \
            --insecure





          echo "========== Check Upload =========="


          mc ls \
            minio/${MINIO_BUCKET}/test/ \
            --insecure





          echo "========== Delete Test File =========="


          mc rm \
            minio/${MINIO_BUCKET}/test/minio-test.txt \
            --insecure





          echo "========== Verify Delete =========="


          mc ls \
            minio/${MINIO_BUCKET}/test/ \
            --insecure || true



          echo "MinIO test success"







      # =====================================
      # Docker Build
      # =====================================

      - name: 构建 Docker 镜像

        run: |


          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .







      # =====================================
      # 查看镜像
      # =====================================

      - name: 查看镜像

        run: |


          docker images





      # =====================================
      # Docker Save
      #
      # 输出:
      #
      # mkt-monitor-20260929-a83f21.tar
      #
      # =====================================

      - name: 导出 Docker 镜像

        run: |


          docker save \
            ${IMAGE_NAME}:${IMAGE_TAG} \
            -o ${IMAGE_NAME}-${IMAGE_TAG}.tar



          ls -lh *.tar







      # =====================================
      # 上传 Docker Artifact 到 MinIO
      # =====================================

      - name: 上传 Docker 镜像文件到 MinIO

        run: |


          echo "========== Upload Docker TAR =========="



          mc cp \
            ${IMAGE_NAME}-${IMAGE_TAG}.tar \
            minio/${MINIO_BUCKET}/${IMAGE_NAME}/${IMAGE_TAG}/ \
            --insecure




          echo "Upload Finished"






      # =====================================
      # 验证
      # =====================================

      - name: 完成检查

        run: |


          echo "=============================="

          echo "Docker Artifact Uploaded"


          echo "MinIO Path:"


          echo "${MINIO_BUCKET}/${IMAGE_NAME}/${IMAGE_TAG}"


          echo "=============================="
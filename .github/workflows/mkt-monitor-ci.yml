name: mkt-monitor CI

on:
  workflow_dispatch:

permissions:
  contents: read


env:
  HARBOR_REGISTRY: host.docker.internal:8088
  IMAGE_NAME: library/mkt-monitor


jobs:
  build:

    runs-on: arc-mkt-monitor

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Check Environment
        run: |
          uname -a
          docker version


      # 登录 Harbor
      - name: Login Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | \
          docker login \
            $HARBOR_REGISTRY \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin


      # Build
      - name: Build Image
        run: |

          docker build \
            -t $HARBOR_REGISTRY/$IMAGE_NAME:test \
            .


      # Push
      - name: Push Image
        run: |

          docker push \
          $HARBOR_REGISTRY/$IMAGE_NAME:test


      # Verify
      - name: Check Image
        run: |
          docker images
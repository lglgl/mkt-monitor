name: mkt-monitor 镜像构建发布 CI


on:

  workflow_dispatch:


permissions:

  contents: read



env:

  # Harbor 地址
  HARBOR_REGISTRY: host.docker.internal:8088

  # Harbor 用户
  HARBOR_USERNAME: admin

  # Harbor 密码
  HARBOR_PASSWORD: HarborLab-2026-ChangeMe



jobs:


  build:


    name: 构建并上传 Harbor 镜像


    runs-on: arc-mkt-monitor



    steps:


      # ==============================
      # Checkout代码
      # ==============================

      - name: 拉取代码

        uses: actions/checkout@v4



      # ==============================
      # 环境检查
      # ==============================

      - name: 初始化环境

        run: |

          echo "========== Runner =========="

          uname -a


          echo

          echo "========== Docker =========="

          docker version



      # ==============================
      # 生成镜像版本
      #
      # 示例:
      # mkt-monitor:20260929-9101603
      #
      # ==============================

      - name: 设置镜像版本

        run: |

          DATE=$(date +%Y%m%d)

          SHA=$(git rev-parse --short HEAD)


          echo "IMAGE_NAME=library/mkt-monitor" >> $GITHUB_ENV

          echo "IMAGE_TAG=${DATE}-${SHA}" >> $GITHUB_ENV


          echo "Image: mkt-monitor:${DATE}-${SHA}"



      # ==============================
      # 登录 Harbor
      # ==============================

      - name: 登录 Harbor

        run: |

          echo "$HARBOR_PASSWORD" | \

          docker login \

          "$HARBOR_REGISTRY" \

          --username "$HARBOR_USERNAME" \

          --password-stdin



      # ==============================
      # Build
      # ==============================

      - name: 构建 Docker 镜像

        run: |

          docker build \

          -t $HARBOR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG \

          .



      # ==============================
      # Push Harbor
      # ==============================

      - name: 上传 Harbor 镜像

        run: |

          docker push \

          $HARBOR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG



      # ==============================
      # 验证
      # ==============================

      - name: 查看镜像

        run: |

          docker images

          echo

          echo "========== Harbor Image =========="

          echo "$HARBOR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
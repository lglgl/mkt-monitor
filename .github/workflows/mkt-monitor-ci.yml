name: mkt-monitor 镜像构建制品上传 CI


on:

  workflow_dispatch:



permissions:

  contents: read



env:


  # ===============================
  # MinIO
  # ===============================

  MINIO_ENDPOINT: http://minio.minio-tenant.svc.cluster.local:9000

  MINIO_BUCKET: dockerfile

  MINIO_ACCESS_KEY: harbor

  MINIO_SECRET_KEY: Ru724DDEi3Xs6JjSBluT1UZEEo7CrfulmPk8Lmo7



jobs:


  build:


    name: 构建 Docker 镜像并上传 MinIO


    runs-on: arc-mkt-monitor



    steps:



      # =====================================
      # Checkout
      # =====================================

      - name: 拉取代码

        uses: actions/checkout@v4



      # =====================================
      # 环境检查
      # =====================================

      - name: Runner 环境检查

        run: |

          echo "========== Runner =========="

          uname -a


          echo

          echo "========== Docker =========="

          docker version



      # =====================================
      # 设置版本
      #
      # 示例:
      # 20260929-a83f21
      #
      # =====================================

      - name: 设置镜像版本

        run: |

          DATE=$(date +%Y%m%d)

          SHA=$(git rev-parse --short HEAD)


          IMAGE_TAG=${DATE}-${SHA}


          echo "IMAGE_NAME=mkt-monitor" >> $GITHUB_ENV

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV


          echo "IMAGE_TAG=${IMAGE_TAG}"



      # =====================================
      # 安装 MinIO Client
      # =====================================

      - name: 安装 MinIO Client

        run: |

          curl -L \
          https://dl.min.io/client/mc/release/linux-amd64/mc \
          -o mc


          chmod +x mc


          sudo mv mc /usr/local/bin/mc


          mc --version



      # =====================================
      # Build
      # =====================================

      - name: 构建 Docker 镜像

        run: |


          docker build \

          -t $IMAGE_NAME:$IMAGE_TAG \

          .



      # =====================================
      # 查看镜像
      # =====================================

      - name: 查看镜像

        run: |

          docker images



      # =====================================
      # Docker Save
      #
      # 生成:
      #
      # mkt-monitor-20260929-a83f21.tar
      #
      # =====================================

      - name: 导出 Docker 镜像

        run: |


          docker save \

          $IMAGE_NAME:$IMAGE_TAG \

          -o ${IMAGE_NAME}-${IMAGE_TAG}.tar



          ls -lh *.tar



      # =====================================
      # MinIO 上传
      # =====================================

      - name: 上传 MinIO


        run: |


          echo "========== MinIO Login =========="


          mc alias set minio \

          $MINIO_ENDPOINT \

          $MINIO_ACCESS_KEY \

          $MINIO_SECRET_KEY



          echo "========== Upload =========="


          mc cp \

          ${IMAGE_NAME}-${IMAGE_TAG}.tar \

          minio/${MINIO_BUCKET}/${IMAGE_NAME}/${IMAGE_TAG}/



          echo "Upload Finished"



      # =====================================
      # 验证
      # =====================================

      - name: 完成检查


        run: |


          echo "=============================="

          echo "Docker Artifact Uploaded"


          echo "Bucket:"

          echo "${MINIO_BUCKET}/${IMAGE_NAME}/${IMAGE_TAG}"


          echo "=============================="
spring:
  application:
    name: mkt-monitor

server:
  port: 18080

management:
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

info:
  app:
    name: mkt-monitor
    description: Market Monitor DevSecOps Lab
    version: 0.0.1-SNAPSHOT

  build:
    java: 21

  environment:
    purpose: devsecops-lab
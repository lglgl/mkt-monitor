plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.dahouzi'
version = '0.0.1-SNAPSHOT'
description = 'Market Monitor - DevSecOps Lab'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {

    // =========================================================
    // 1. Application dependencies
    // =========================================================

    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'io.micrometer:micrometer-registry-prometheus'


    // =========================================================
    // 2. INTENTIONAL VULNERABILITIES
    //
    // These dependencies are intentionally outdated.
    // They are ONLY used for the DevSecOps security pipeline lab.
    //
    // Trivy should detect these vulnerabilities during CI.
    //
    // DO NOT use these versions in production.
    // =========================================================

    // INTENTIONAL VULNERABILITY
    // Log4Shell and related vulnerabilities.
    // Fixed versions are newer than 2.14.1.
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'

    // INTENTIONAL VULNERABILITY
    // Commons Text vulnerability.
    // Fixed version: 1.10.0
    implementation 'org.apache.commons:commons-text:1.9'


    // =========================================================
    // 3. Test
    // =========================================================

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
